<div>
  <div class="mb-5 flex justify-between items-center select-none">
    <h1 class="text-[22px] font-medium tracking-tight text-[#1a1a1a]">Dashboard Overview</h1>
  </div>

  <!-- Metrics -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
    @for (tile of metricTiles; track tile.title) {
      <app-metric-tile [title]="tile.title" [value]="tile.value" [details]="tile.details">
      </app-metric-tile>
    }
  </div>

  <!-- Main content split -->
  <div class="grid grid-cols-1 md:grid-cols-[65%_33%] gap-8">
    <!-- Left column -->
    <div>
      <!-- Recent Projects -->
      <div class="bg-white mb-4 border border-gray-200 rounded-lg shadow-sm">
        <h2 class="bg-secondary text-black px-4 py-2 rounded">
          <span class="inline-flex items-center gap-2">
            <lucide-angular class="inline-block" [img]="FolderGit2" [size]="18"> </lucide-angular>

            <span class="text-lg font-medium"> Recent Projects </span>
          </span>
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4">
          <app-project-card
            *ngFor="let project of projects$ | async"
            [project]="project"
          ></app-project-card>

          <!-- @for (project of projects; track project.project_name) {
            <app-project-card [project]="project"></app-project-card>
          } -->
        </div>
      </div>

      <!-- Projects with Most Deployments (Chart) -->
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <h2 class="text-lg font-small mb-4 bg-secondary text-black px-4 py-2 rounded">
          Projects with Most Deployments
        </h2>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="w-full h-64">
            <!-- <ngx-charts-bar-vertical
              [results]="deploymentChartData"
              [xAxis]="true"
              [yAxis]="true"
              [legend]="false"
              [showDataLabel]="true"  
              scheme="vivid"> 
            </ngx-charts-bar-vertical> -->
          </div>
        </div>
      </div>
    </div>

    <!-- Right column -->
    <div
      class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-y-auto md:max-h-[870px] md:overflow-y-auto max-h-none"
    >
      <h2 class="text-lg font-small mb-4 bg-secondary text-black rounded px-4 py-2">
        <span class="inline-flex items-center gap-2">
          <lucide-angular class="inline-block" [img]="Clock3" [size]="18"></lucide-angular>
          <span class="text-lg font-medium"> Recent Activity </span>
        </span>
      </h2>

      <app-activity-list [activities]="(activities$ | async) || []"></app-activity-list>
    </div>
  </div>
</div>
