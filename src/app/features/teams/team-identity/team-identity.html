<div class="flex gap-6 px-1 py-1 h-full" [formGroup]="form">
  <div class="flex-1">
    <h3 class="text-sm font-semibold text-[#1a1a1a] pb-1 border-b border-black/5">
      Team Identity
    </h3>

    <!-- Team Name -->
    <app-input-field label="Team Name" type="text" placeholder="eg. Backend Team" [required]="true"
      formControlName="teamName">
    </app-input-field>
    <!-- <span *ngIf="form.get('teamName')?.invalid && form.get('teamName')?.touched" class="text-[10px] text-[#c62828]">
      Team Name is required (2–64 characters)
    </span> -->

    <!-- Team Lead -->
    <div class="flex flex-col gap-1 mt-3">
      <label class="text-xs font-semibold text-[#8a7f75]">
        Team Lead <span class="text-[#c62828]">*</span>
      </label>
      <select formControlName="teamLeadID"
        class="w-full bg-[#fdfcf9] border text-sm px-3 py-2 rounded-md focus:outline-none focus:border-[#d08873]/50">
        <option value="">Select Team Lead</option>
        <option *ngFor="let teamLead of teamLeads; trackBy: trackById" [value]="teamLead.id.toString()">
          {{ teamLead.name }} ({{ teamLead.role_name }})
        </option>
      </select>
      <span *ngIf="form.get('teamLeadID')?.invalid && form.get('teamLeadID')?.touched"
        class="text-[10px] text-[#c62828]">Team Lead is required</span>
    </div>

    <!-- Notes -->
    <div class="grid grid-cols-1 gap-4 mt-3 mb-3">
      <label class="text-xs font-semibold text-[#8a7f75] mt-4">Notes</label>
      <textarea formControlName="teamDescription" rows="4" placeholder="Responsible for core user backend APIs"
        class="w-full bg-[#fdfcf9] border border-black/5 text-sm p-2.5 rounded-md focus:outline-none focus:border-[#d08873]/50"></textarea>
    </div>
  </div>
</div>
