<div class="p-4" [formGroup]="form">
  <!-- Header -->
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-sm font-semibold text-[#1a1a1a] pb-1 border-b border-black/5">
      Select Team Members
    </h3>

    <div class="flex items-center gap-3">
      <!-- Search -->
      <div class="relative">
        <input type="search" [formControl]="searchControl" class="w-64 text-sm px-3 py-2 rounded-md border bg-white 
                 focus:outline-none focus:ring-1 focus:ring-[#d08873]/50" placeholder="Search users…"
          aria-label="Search users" />
      </div>

      <!-- Counter -->
      <div class="text-xs text-gray-500">
        <strong>{{ (form.get('teamMembers')?.value?.length ?? 0) }}</strong> selected
      </div>
    </div>
  </div>

  <!-- User list -->
  <div class="mt-2 max-h-72 overflow-auto">
    <div *ngIf="users.length === 0" class="text-sm text-gray-500 p-3">
      No users found.
    </div>

    <!-- Responsive grid: 1 col on small, 2 on md, 3 on lg -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div *ngFor="let user of filteredUsers(); trackBy: trackById" class="flex items-center gap-3 p-3 rounded-md border border-black/5 
               bg-[#fdfcf9] hover:bg-[#f4f2ef]/50 transition-colors cursor-pointer">
        <!-- Checkbox -->
        <input type="checkbox" class="w-5 h-5 cursor-pointer appearance-none rounded-full border border-gray-400 
                 checked:bg-primary checked:border-primary transition-colors" [id]="user.id"
          [checked]="isSelected(user)" (change)="toggleMember(user)" [disabled]="isLeadUser(user)" />

        <!-- Label -->
        <label class="flex-1 cursor-pointer" [for]="user.id">
          <div class="flex items-center gap-2.5">
            <!-- Avatar -->
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white 
                     text-sm font-semibold shrink-0 bg-primary/20"
              [ngStyle]="{ 'background-color': avatarColor(user.id) }">
              {{ initials(user.name) }}
            </div>

            <!-- User Info -->
            <div class="flex flex-col flex-1">
              <span class="text-xs font-bold text-[#1a1a1a]">{{ user.name }}</span>
              <span class="text-[10px] text-[#8a7f75]">{{ user.role_name }}</span>
            </div>
          </div>
        </label>
      </div>
    </div>
  </div>

  <!-- Validation -->
  <div class="mt-3">
    <span *ngIf="(form.get('teamMembers')?.value?.length ?? 0) === 0 && form.get('teamMembers')?.touched"
      class="text-[10px] text-[#c62828]">
      At least one member is required
    </span>
  </div>
</div>
