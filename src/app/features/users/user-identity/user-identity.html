<div class="flex gap-6 px-6 py-5" [formGroup]="userForm">
  <div class="flex-1">
    <h3 class="text-sm font-semibold text-[#1a1a1a] pb-1 border-b border-black/5">User Identity</h3>

    <div class="grid grid-cols-2 gap-4 mt-3">
      <!-- Member Name -->
      <div class="flex flex-col gap-1">
        <app-input-field label="Member Name" type="text" [leftIcon]="" placeholder="eg. Alek K." [required]="true"
          class="w-full bg-[#fdfcf9] border text-sm px-3 py-2.5 rounded-md focus:outline-none focus:border-[#d08873]/50"
          [class.border-[#c62828]/60]="errorFor('name')" [class.border-black/5]="!errorFor('name')"
          formControlName="name">
        </app-input-field>
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1">
        <app-input-field label="Email" type="email" [leftIcon]="" placeholder="eg. alek.k@example.com" [required]="true"
          class="w-full bg-[#fdfcf9] border text-sm px-3 py-2.5 rounded-md focus:outline-none focus:border-[#d08873]/50"
          [class.border-[#c62828]/60]="errorFor('email')" [class.border-black/5]="!errorFor('email')"
          formControlName="email">
        </app-input-field>
      </div>

      <!-- Role -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-[#8a7f75]">
          Role <span class="text-[#c62828]">*</span>
        </label>
        <select formControlName="role_id"
          class="w-full bg-[#fdfcf9] border text-sm px-3 py-2 rounded-md focus:outline-none focus:border-[#d08873]/50"
          [class.border-[#c62828]/60]="errorFor('role_id')" [class.border-black/5]="!errorFor('role_id')">
          <option value="">Select Role</option>
          @for (role of roles; track role.id) {
          <option [value]="role.id">{{ role.name }}</option>
          }
        </select>
        @if (errorFor('role_id')) {
        <span class="text-[10px] text-[#c62828]">{{ errorFor('role_id') }}</span>
        }
      </div>

      <!-- GitHub Verification -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-[#8a7f75]">
          Verify GitHub User <span class="text-[#c62828]">*</span>
        </label>
        <div class="flex items-center gap-2">
          <input type="text" formControlName="github_username" placeholder="eg. alexk-dev"
            class="flex-1 bg-[#fdfcf9] border text-sm px-3 py-2 rounded-md focus:outline-none focus:border-[#d08873]/50"
            [class.border-[#c62828]/60]="errorFor('github_username')"
            [class.border-black/5]="!errorFor('github_username')" />
          <button type="button"
            class="px-3 py-2 text-xs font-semibold rounded-md border border-[#d08873] text-[#d08873] hover:bg-[#d08873] hover:text-white transition"
            (click)="verifyGithubUser(data.id, userForm.value.github_username)">
            Verify
          </button>
        </div>
        @if (errorFor('github_username')) {
        <span class="text-[10px] text-[#c62828]">{{ errorFor('github_username') }}</span>
        }
      </div>
    </div>
  </div>
</div>
