<div class="flex h-screen overflow-hidden bg-[#fdfcf9]">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main content area -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Top bar -->
    <header
      class="h-13 bg-white border-b border-gray-200 flex items-center justify-between px-3 md:px-6 shrink-0 gap-2"
    >
      <!-- Page title (hidden on small screens) -->
      <div class="hidden md:block">
        <h1 class="text-base font-semibold text-gray-800">{{ pageTitle }}</h1>
      </div>

      <!-- Search bar (responsive width) -->
      <div class="flex-1 md:flex-none md:w-[30%] bg-gray-100 rounded-md">
        <app-input-field
          label=""
          type="text"
          [leftIcon]="SearchIcon"
          [placeholder]="searchPlaceholder"
          [required]="false"
          formControlName="globalSearch"
        >
        </app-input-field>
      </div>

      <!-- Right: Quick Actions -->
      <div class="flex items-center gap-2 md:gap-3">
        <button
          class="inline-flex items-center gap-2 px-2 md:px-3 py-1 bg-primary text-white text-sm font-medium rounded-md hover:bg-primary/90 transition"
          (click)="toggleQuickActions()"
          [title]="isSmallScreen ? 'Quick Actions' : ''"
        >
          <lucide-icon [img]="Plus" [size]="16"></lucide-icon>
          <span class="hidden md:inline">Quick Actions</span>
        </button>
      </div>
    </header>

    <!-- Dropdown Panel -->
    <app-quick-actions-panel [isOpen]="showQuickActions"></app-quick-actions-panel>

    <!-- Scrollable page content -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
