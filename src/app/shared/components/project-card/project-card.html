<div
  class="bg-white rounded-md shadow p-4 hover:shadow-lg hover:scale-[1.01] transition-transform duration-300"
>
  <!-- Gradient header bar -->
  <!-- <div
    class="h-1 w-full bg-gradient-to-r from-orange-400 via-pink-500 to-purple-500 rounded-t-md mb-2"
  ></div> -->

  <!-- Header -->
  <div class="flex justify-between items-center mb-2">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full status-dot" [ngClass]="statusColor"></span>
      <h3 class="text-md font-bold text-gray-800">
        {{ project.project_name }}
      </h3>
    </div>
    <span
      class="bg-[#fdfcf9] border border-black/5 text-[#8a7f75] text-[11px] font-medium px-1 py-0.5 rounded-full shadow-sm"
    >
      <app-badge badgeStatus="{{ project.total_environments }} Envs"></app-badge>
    </span>
  </div>

  <!-- Description -->
  <p class="text-sm text-gray-600 mb-2">{{ project.project_description }}</p>

  <!-- Source & Branch -->
  <div class="flex gap-2 mb-2">
    <span class="px-2 py-0.5 text-xs rounded bg-blue-100 text-blue-600 flex items-center gap-1">
      <i class="fas fa-code"></i> {{ project.github_org + '/' + project.github_repo }}
    </span>
    <span class="px-2 py-0.5 text-xs rounded bg-purple-100 text-purple-600 flex items-center gap-1">
      <i class="fas fa-code-branch"></i> {{ project.branch }}
    </span>
  </div>

  <!-- Health Stats -->
  <div class="flex gap-4 items-center mb-1">
    <span class="text-sm text-green-600 flex items-center gap-1">
      <i class="fas fa-check-circle"></i> Healthy: {{ project.healthy }}
    </span>
    <span class="text-sm text-red-600 flex items-center gap-1">
      <i class="fas fa-times-circle"></i> Unhealthy: {{ project.unhealthy }}
    </span>
  </div>

  <!-- Progress Bar -->
  <div class="w-full h-1 bg-gray-100 rounded-full overflow-hidden mb-3 flex">
    <div
      class="h-1 bg-green-500 transition-all duration-500 ease-out"
      [style.width.%]="healthyPercent"
    ></div>
    <div
      class="h-1 bg-red-500 transition-all duration-500 ease-out"
      [style.width.%]="unhealthyPercent"
    ></div>
  </div>

  <div class="border-t border-gray-200 my-3"></div>

  <!-- Footer -->
  <div class="flex justify-between items-center text-xs text-gray-500">
    <span class="flex items-center gap-1">
      <i class="far fa-clock"></i> Last updated {{ project.updated_at }}
    </span>
    <a
      [routerLink]="['/projects', project.project_name]"
      [state]="{ project: project }"
      class="flex items-center gap-1 text-orange-400 font-medium hover:underline hover:text-orange-500 hover:translate-x-0.5 transition-all"
    >
      View <span class="text-orange-100">-&gt;</span>
    </a>
  </div>
</div>
